name: Agent catalog checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Codex and Cursor copies are current
        run: python3 scripts/build_agents.py --check
      - name: Project install
        run: python3 skills/agent-setup/scripts/test_install.py
      - name: Catalog and interactive install
        run: python3 skills/agent-setup/scripts/test_catalog.py
