name: Agent catalog checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Renderer evaluations
        run: python3 skills/agent-setup/evals/run.py
      - name: Shared state and exclusions
        run: python3 skills/agent-setup/evals/state.py
